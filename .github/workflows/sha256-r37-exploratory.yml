name: sha256-r37-exploratory
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: hashsmash-sha256-r37-exploratory-${{ github.ref }}
  cancel-in-progress: false
jobs:
  review:
    uses: ./.github/workflows/paired-review.yml
    with:
      track: sha256-r37-exploratory
      lane: exploratory
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
