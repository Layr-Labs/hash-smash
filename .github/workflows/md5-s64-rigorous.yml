name: md5-s64-rigorous
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: hashsmash-md5-s64-rigorous-${{ github.ref }}
  cancel-in-progress: false
jobs:
  review:
    uses: ./.github/workflows/paired-review.yml
    with:
      track: md5-s64-rigorous
      lane: rigorous
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
